name: Proposal
description: Propose a new command, option or rule, or a change to one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the situation with a small synthetic example. Do not paste private research, credentials or tokens.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you were trying to record, check or read, and where rb falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: The command, option or output you want, and what it should do.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: rb version
      description: What `rb version` prints, if you use rb today.
      placeholder: rabbit-brain 0.6.0
