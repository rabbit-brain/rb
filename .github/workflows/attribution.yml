name: attribution

# Commits are made under their authors' own names. This fails a commit whose author, committer or co-author trailer is
# a coding agent, and a commit or pull request that carries an agent session trailer or link or a generated-with footer.
on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize]   # edited: a changed title or body is checked again

permissions:
  contents: read

jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0           # the pushed range and the default branch it is read against
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python .github/scripts/test-attribution.py
      - name: Check the pushed commits, or the pull request's commits, title and body
        run: python .github/scripts/check-attribution.py
