name: public content

# Detection, not prevention: by the time this runs, what was pushed is public on a public repository.
on:
  push:
  pull_request:
    types: [opened, edited, reopened, synchronize]   # edited: a changed title or body is checked again

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -I -S .github/scripts/test-public-content.py

  scan:
    # Only rabbit-brain/rb holds the secret, so forks skip the scan. Never use pull_request_target
    # to execute a fork PR's checkout with secrets; scan the reviewed merge on push.
    if: github.repository == 'rabbit-brain/rb' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0           # the pushed history, and the default branch a new branch is read against
          persist-credentials: false
      # The runner's own Python, isolated (-I -S): nothing is installed in the job that holds the secret.
      - name: Check the committed files, what the push or pull request adds, and a pull request's title and body
        env:
          RB_RELEASE_DENYLIST: ${{ secrets.RB_RELEASE_DENYLIST }}
          # The event's data reaches the scanner as its environment, never as part of the script.
          SCAN_BEFORE: ${{ github.event.before }}
          SCAN_AFTER: ${{ github.event.after }}
          SCAN_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_PR_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SCAN_PR_TITLE: ${{ github.event.pull_request.title }}
          SCAN_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -I -S .github/scripts/check-public-content.py --source . --history
