name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]" numpy pillow
      - name: Test
        # the RAFT adapter tests skip without torch and a RAFT checkout (RB_RAFT_PATH); everything else runs
        run: python -m pytest -q
      - name: Package builds and the docs agree with the CLI
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          rb version
          rb docs | head -3
