name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# pytest -n auto: the suite in parallel, as it is checked before every merge; one test at a time it runs for hours
# --reruns 2: a browser check that loses a race under that load gets two more tries, each marked R in the output
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rust
      - name: Install (builds the rb binary)
        run: python -m pip install -e ".[dev]"
      - name: Test rb
        run: |
          cargo test --manifest-path rust/Cargo.toml -q
          python -m pytest -q -n auto --reruns 2
      - name: The app runner drives Chrome over CDP (fails, never skips, without node 22 or Chrome)
        env:
          RB_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -n auto --reruns 2 tests/test_shell.py tests/app/
      - name: rb says and writes what is stored (every golden scenario, rb open's answers, the hub commands)
        run: |
          python rust/tests_py/golden.py --stored "$(command -v rb)" -j 4
          python rust/tests_py/diff_open.py --stored "$(command -v rb)"
          python rust/tests_py/diff_hub.py --stored "$(command -v rb)"
      - name: Package builds and the docs agree with the CLI
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          rb version
          rabbit-brain version
          rb docs | head -3

  # rb on Windows: the binary built there, its own tests, and the same suite driving it. What is stored (the goldens)
  # is Linux's wording of a path and of a system error, and is held on Linux alone; PYTHONUTF8 has the tests' own
  # Python read and write UTF-8, as rb does everywhere.
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash       # every line's failure fails the step (PowerShell reports only the last command's)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rust
      - name: Install (builds the rb binary)
        run: python -m pip install -e ".[dev]"
      - name: Test rb
        run: |
          cargo test --manifest-path rust/Cargo.toml -q
          python -m pytest -q -n auto --reruns 2
      - name: The app runner drives Chrome over CDP (fails, never skips, without node 22 or Chrome)
        env:
          RB_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -n auto --reruns 2 tests/test_shell.py tests/app/
      - name: The commands answer
        run: |
          rb version
          rabbit-brain version
          rb tour "$RUNNER_TEMP/rb-tour"

  # Leaving rb, where people run it: the round trip (try rb, remove it, nothing of it left), rb remove's own cases and
  # the worktree tests, on macOS beside Linux, and on Windows, whose job above runs them in the whole suite too. A check
  # that needs a POSIX terminal or signal is skipped on Windows, and says why.
  leaving:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable branch, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: rust
      - name: Install (builds the rb binary)
        run: python -m pip install -e ".[dev]"
      - name: Leaving rb leaves the repository as it was
        run: python -m pytest -q -n auto --reruns 2 tests/test_removal.py tests/test_remove.py tests/test_worktrees.py
      - name: The app runner drives Chrome over CDP (fails, never skips, without node 22 or Chrome)
        env:
          RB_REQUIRE_BROWSER: "1"
        run: python -m pytest -q -n auto --reruns 2 tests/test_shell.py tests/app/
