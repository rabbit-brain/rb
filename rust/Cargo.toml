[package]
name = "rabbit-brain"
version = "0.6.0"
edition = "2021"
# the oldest Rust that builds rb: File::try_lock, which holds the analytics queue, is stable from 1.89
rust-version = "1.89"
description = "Rabbit Brain (rb): the record of the experiments your coding agents run, as plain files in your repo."
license = "Apache-2.0"
repository = "https://github.com/rabbit-brain/rb"
publish = false
# what builds rb goes into the source distribution; the architecture notes, generators and differential tests stay in the repository
exclude = ["ARCHITECTURE.md", "gen/", "tests_py/"]

[lib]
name = "rb"
path = "src/lib.rs"

[[bin]]
name = "rb"
path = "src/main.rs"

# the package's own name for the same command (uvx rabbit-brain, pipx run rabbit-brain): it runs the rb beside it
[[bin]]
name = "rabbit-brain"
path = "src/bin/rabbit-brain.rs"

# the differential tests' helper (rust/tests_py/diff_*.py): built on request (--features oracle), never shipped
[[bin]]
name = "rbdiff"
path = "src/bin/rbdiff.rs"
required-features = ["oracle"]

[features]
oracle = []

[dependencies]
indexmap = "2"
regex = "1"
fancy-regex = "0.14"
sha2 = "0.10"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
yaml-rust2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# the hub's sign-in, sync and revoke calls, and the download of a bundle someone names: rustls, with the platform's own
# certificate verification (as Python's ssl reads the system's), so no OpenSSL to link
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# rb reads a record by building many small values; an allocator made for that
mimalloc = { version = "0.1", default-features = false }
# a SQLite database a run's numbers are in, read and never written (rb run add --from, rb compile): SQLite's own C,
# built in, so no system library is needed
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

# what differs between systems is in src/sys.rs: libc's calls on Linux and macOS, the Windows API's on Windows
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security_Cryptography", "Wdk_System_SystemServices"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = true
strip = false
lto = false
codegen-units = 16
