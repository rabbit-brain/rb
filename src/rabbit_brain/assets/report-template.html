  late_share  = sum(updates in the last third of iterations) / sum(all updates)
  reversals   = iterations where the update grew by more than 5% over the previous one
  late_update = mean update over the last quarter of iterations, in the metric's unit

import json
import math

    if isinstance(value, bool) or not isinstance(value, (int, float)) or not math.isfinite(value) or value < 0:
        raise ValueError(name + " must be a finite nonnegative number")
    return value

def read(path):
    with open(path, encoding="utf-8") as f:
        return json.load(f)

def trajectory_stats(values, name):
    if not isinstance(values, list) or not 2 <= len(values) <= 64:
        raise ValueError(name + " must hold 2 to 64 per-iteration update magnitudes")
    values = [number(v, name) for v in values]
    total = sum(values)
    start = (len(values) * 2) // 3
    late = sum(values[start:])
    reversals = sum(1 for i in range(1, len(values)) if values[i] > values[i - 1] * 1.05 + 1e-9)

`,"record_trajectory.py":`# Rabbit Brain: record a refinement trajectory inside your model's update loop.
# Drop-in for RAFT-style iterative models (PyTorch). Label-free: no ground truth needed.
#
#   from record_trajectory import TrajectoryRecorder
#   rec = TrajectoryRecorder()
#   for k in range(iters):
#       delta_flow = update_block(...)         # your existing update
#       flow = flow + delta_flow
#       rec.step(delta_flow)                   # one number per iteration
#   trajectory = rec.values                    # -> candidate_trajectory for this case
#
# Export one trajectory per case per model version, then convert_csv.py (semicolon-separated)
# or write the JSON directly. Values are mean |update| in px over the valid region.

def _flatten(value):
    if isinstance(value, (list, tuple)):
        for item in value:
            yield from _flatten(item)
    else:
        yield float(value)

class TrajectoryRecorder:
    def __init__(self, mask=None):
        self.values = []
        self.mask = mask  # optional boolean tensor of valid pixels (same spatial shape as the update)

    def step(self, delta):
        if hasattr(delta, "detach"):  # torch tensor, e.g. shape (B, 2, H, W)
            magnitude = delta.detach().abs()
            if magnitude.dim() >= 3 and magnitude.shape[-3] == 2:
                magnitude = magnitude.sum(dim=-3)  # L1 norm of the 2-D update per pixel
            if self.mask is not None:
                magnitude = magnitude[self.mask]
            value = float(magnitude.float().mean().item())
        elif hasattr(delta, "mean") and hasattr(delta, "shape"):  # numpy array
            magnitude = abs(delta)
            if self.mask is not None:
                magnitude = magnitude[self.mask]
            value = float(magnitude.mean())
        else:  # plain nested lists
            flat = [abs(v) for v in _flatten(delta)]
            value = sum(flat) / max(len(flat), 1)
        self.values.append(round(value, 4))
        return value
